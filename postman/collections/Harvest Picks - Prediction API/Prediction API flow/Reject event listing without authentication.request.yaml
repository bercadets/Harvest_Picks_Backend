$kind: http-request
url: "{{baseUrl}}/api/prediction/events"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Unauthenticated request is rejected', function () { pm.response.to.have.status(401); });
      pm.test('Error uses the API error envelope', function () { pm.expect(pm.response.json().error).to.be.an('object'); });
    language: text/javascript
order: 1000
