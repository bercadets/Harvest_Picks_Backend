$kind: http-request
url: "{{baseUrl}}/api/prediction/events/{{eventId}}?stake={{stakePoints}}"
method: GET
headers:
  Authorization: Bearer {{farmerToken}}
queryParams:
  stake: "{{stakePoints}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Event details are returned', function () { pm.response.to.have.status(200); });
      pm.test('Event includes quote data', function () { const body = pm.response.json(); pm.expect(body.id).to.eql(pm.collectionVariables.get('eventId')); pm.expect(body.options).to.be.an('array').that.is.not.empty; pm.expect(body.options[0].multiplier).to.be.a('string'); });
    language: text/javascript
order: 5000
